name: Publish Crates Package

on:
  workflow_call:
    inputs:
      workspace_path:
        description: 'Path to the workspace to publish'
        required: true
        type: string
      workspace_version:
        description: 'Version to publish for the workspace'
        required: true
        type: string
      release_tag:
        description: 'Release tag (e.g., alpha, rc, stable)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish Crates Package (${{ inputs.workspace_path }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Get crate name to be released
        id: get-name
        working-directory: ${{ inputs.workspace_path }}
        run: |
          METADATA_JSON="$(cargo metadata --no-deps --format-version 1)"
          PACKAGE_NAME="$(jq -r '.packages[0].name // empty' <<< "$METADATA_JSON")"
          PACKAGE_VERSION="$(jq -r '.packages[0].version // empty' <<< "$METADATA_JSON")"

          if [ -z "$PACKAGE_NAME" ]; then
            echo "❌ Could not read package.name from cargo metadata"
            exit 1
          fi

          if [ -z "$PACKAGE_VERSION" ]; then
            echo "❌ Could not read package.version from cargo metadata"
            exit 1
          fi

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify version matches expected
        working-directory: ${{ inputs.workspace_path }}
        run: |
          ACTUAL_VERSION="${{ steps.get-name.outputs.version }}"
          if [ "$ACTUAL_VERSION" != "${{ inputs.workspace_version }}" ]; then
            echo "❌ Version mismatch: expected ${{ inputs.workspace_version }}, got $ACTUAL_VERSION"
            exit 1
          fi
          echo "✅ Version verified: $ACTUAL_VERSION"
      - name: Publish crates package
        working-directory: ${{ inputs.workspace_path }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ inputs.release_tag }}" = "stable" ]; then
            echo "📦 Publishing stable crate"
          else
            echo "📦 Publishing pre-release crate (${{ inputs.release_tag }})"
          fi
          cargo publish --locked
      - name: Add Tag
        run: |
          TAG_NAME="${PACKAGE_NAME}-v${VERSION}"
          git tag "$TAG_NAME"
          git push --tags origin "$TAG_NAME"
        env:
          PACKAGE_NAME: ${{ steps.get-name.outputs.name }}
          VERSION: ${{ inputs.workspace_version }}
